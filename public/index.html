<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fahrenheit to Celsius</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #0f1419;
      color: #e8eef4;
    }
    main {
      width: min(28rem, calc(100vw - 2rem));
      background: #18202a;
      border: 1px solid #2a3644;
      border-radius: 16px;
      padding: 1.5rem 1.4rem 1.4rem;
    }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 0.35rem; }
    p.hint { margin: 0 0 1.1rem; color: #9aa8b6; font-size: 0.9rem; }
    label { display: block; font-size: 0.8rem; color: #9aa8b6; margin-bottom: 0.4rem; }
    input[type=number] {
      width: 100%;
      box-sizing: border-box;
      font-size: 1.4rem;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      border: 1px solid #3a4a5c;
      background: #0f1419;
      color: inherit;
    }
    button {
      margin-top: 0.85rem;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 0.7rem;
      font-size: 1rem;
      font-weight: 600;
      background: #3d8bfd;
      color: #041428;
      cursor: pointer;
    }
    .out {
      margin-top: 1.1rem;
      font-size: 2rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .out span { color: #9aa8b6; font-size: 1rem; font-weight: 500; }
    .err { margin-top: 0.8rem; color: #ff8a8a; }
    code { font-size: 0.85em; }
  </style>
</head>
<body>
  <main>
    <h1>Night temp, Fahrenheit to Celsius</h1>
    <p class="hint">Pass <code>?f=68</code> in the URL, or type it here. Formula: °C = (°F − 32) × 5/9.</p>
    <form id="form">
      <label for="f">Fahrenheit</label>
      <input id="f" name="f" type="number" step="any" inputmode="decimal" required />
      <button type="submit">Convert</button>
    </form>
    <div class="out" id="out" hidden></div>
    <div class="err" id="err" hidden></div>
  </main>
  <script>
    function celsius(f) {
      return (Number(f) - 32) * 5 / 9;
    }
    function show(f) {
      const err = document.getElementById('err');
      const out = document.getElementById('out');
      const n = Number(f);
      if (!Number.isFinite(n)) {
        out.hidden = true;
        err.hidden = false;
        err.textContent = 'Need a number for Fahrenheit.';
        return;
      }
      err.hidden = true;
      out.hidden = false;
      const c = celsius(n);
      out.innerHTML = c.toFixed(1) + ' °C <span>(' + n + ' °F)</span>';
      document.getElementById('f').value = n;
    }
    const params = new URLSearchParams(location.search);
    const f = params.get('f') ?? params.get('fahrenheit');
    if (f !== null && f !== '') show(f);
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const value = document.getElementById('f').value;
      const url = new URL(location.href);
      url.searchParams.set('f', value);
      history.replaceState(null, '', url);
      show(value);
    });
  </script>
</body>
</html>
