<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060d" />
  <title>Celsius and Fahrenheit</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <main class="card">
      <h1>TEMP GLOW</h1>
      <p class="sub">Celsius on top. Type 37.6. It stays.</p>
      <div class="stage">
        <div class="tube" aria-hidden="true">
          <div class="mercury" id="mercury"></div>
          <div class="bulb"></div>
        </div>
        <div class="read">
          <div class="c" id="cOut">—</div>
          <div class="f" id="fOut">—</div>
        </div>
      </div>
      <div class="field">
        <label for="c">Celsius</label>
        <input id="c" type="text" inputmode="decimal" autocomplete="off" placeholder="37.6" />
      </div>
      <div class="field">
        <label for="f">Fahrenheit</label>
        <input id="f" type="text" inputmode="decimal" autocomplete="off" placeholder="99.7" />
      </div>
      <div class="err" id="err"></div>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
