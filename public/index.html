<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05030a" />
  <title>Glow</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <p class="eyebrow">For the two of you</p>
      <label for="c">Celsius</label>
      <input id="c" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="37.6" />
    </header>

    <section class="viz" aria-live="polite">
      <div class="orb" id="orb">
        <svg viewBox="0 0 220 220" class="ring">
          <circle class="track" cx="110" cy="110" r="92" />
          <circle class="arc" id="arc" cx="110" cy="110" r="92" />
        </svg>
        <div class="core">
          <div class="c" id="cOut">—</div>
          <div class="f" id="fOut">—</div>
        </div>
      </div>
    </section>

    <footer class="status" id="status">
      <h1 id="title">Type a temp</h1>
      <p id="line">Celsius in. Fahrenheit and a read on how you feel.</p>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
