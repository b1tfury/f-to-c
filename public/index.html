<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fahrenheit and Celsius</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #0f1419;
      color: #e8eef4;
    }
    main {
      width: min(28rem, calc(100vw - 2rem));
      background: #18202a;
      border: 1px solid #2a3644;
      border-radius: 16px;
      padding: 1.5rem 1.4rem 1.4rem;
    }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 0.35rem; }
    p.hint { margin: 0 0 1.1rem; color: #9aa8b6; font-size: 0.9rem; }
    label { display: block; font-size: 0.8rem; color: #9aa8b6; margin-bottom: 0.4rem; }
    .row { margin-bottom: 0.9rem; }
    input[type=number] {
      width: 100%;
      box-sizing: border-box;
      font-size: 1.4rem;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      border: 1px solid #3a4a5c;
      background: #0f1419;
      color: inherit;
    }
    button {
      margin-top: 0.2rem;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 0.7rem;
      font-size: 1rem;
      font-weight: 600;
      background: #3d8bfd;
      color: #041428;
      cursor: pointer;
    }
    .out {
      margin-top: 1.1rem;
      font-size: 1.6rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .out span { color: #9aa8b6; font-size: 1rem; font-weight: 500; }
    .err { margin-top: 0.8rem; color: #ff8a8a; }
    code { font-size: 0.85em; }
  </style>
</head>
<body>
  <main>
    <h1>Night temp, both ways</h1>
    <p class="hint">Pass <code>?f=68</code> or <code>?c=20</code>. Either field updates the other. °C = (°F − 32) × 5/9.</p>
    <form id="form">
      <div class="row">
        <label for="f">Fahrenheit</label>
        <input id="f" name="f" type="number" step="any" inputmode="decimal" />
      </div>
      <div class="row">
        <label for="c">Celsius</label>
        <input id="c" name="c" type="number" step="any" inputmode="decimal" />
      </div>
      <button type="submit">Convert</button>
    </form>
    <div class="out" id="out" hidden></div>
    <div class="err" id="err" hidden></div>
  </main>
  <script>
    const fEl = document.getElementById('f');
    const cEl = document.getElementById('c');
    const out = document.getElementById('out');
    const err = document.getElementById('err');

    function toC(f) { return (Number(f) - 32) * 5 / 9; }
    function toF(c) { return Number(c) * 9 / 5 + 32; }

    function round(n) {
      return Math.round(n * 10) / 10;
    }

    function setUrl(from, value) {
      const url = new URL(location.href);
      url.search = '';
      url.searchParams.set(from, value);
      history.replaceState(null, '', url);
    }

    function show(from, raw) {
      const n = Number(raw);
      if (raw === '' || !Number.isFinite(n)) {
        out.hidden = true;
        err.hidden = false;
        err.textContent = 'Need a number.';
        return;
      }
      err.hidden = true;
      out.hidden = false;
      if (from === 'f') {
        const c = toC(n);
        fEl.value = n;
        cEl.value = round(c);
        setUrl('f', n);
        out.innerHTML = round(c) + ' °C <span>from ' + n + ' °F</span>';
      } else {
        const f = toF(n);
        cEl.value = n;
        fEl.value = round(f);
        setUrl('c', n);
        out.innerHTML = round(f) + ' °F <span>from ' + n + ' °C</span>';
      }
    }

    const params = new URLSearchParams(location.search);
    const f = params.get('f') ?? params.get('fahrenheit');
    const c = params.get('c') ?? params.get('celsius');
    if (f !== null && f !== '') show('f', f);
    else if (c !== null && c !== '') show('c', c);

    fEl.addEventListener('input', () => {
      if (fEl.value !== '') show('f', fEl.value);
    });
    cEl.addEventListener('input', () => {
      if (cEl.value !== '') show('c', cEl.value);
    });
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (document.activeElement === cEl || (cEl.value && !fEl.value)) show('c', cEl.value);
      else show('f', fEl.value);
    });
  </script>
</body>
</html>
